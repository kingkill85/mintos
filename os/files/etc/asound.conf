# The rk817 codec (speaker/headphones) is the default card, whatever number it gets
# (with HDMI audio built into the kernel, HDMI becomes card 0).
defaults.pcm.!card "rk817int"
defaults.ctl.!card "rk817int"
# Bluetooth headphones: rg353-audio writes this file while one is connected (default -> bluealsa)
@hooks [ { func load files [ "/run/mintos/asound-bt.conf" ] errors false } ]
