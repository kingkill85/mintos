# rgarch per-system settings. Sections are folder names under /storage/roms.
#   core    = libretro core name (cores/<core>_libretro.so)
#   scale   = integer | aspect | full | custom X Y W H   (640x480 screen)
#   filter  = nearest | sharp | linear | scanlines (sharp + CRT lines)
#   overlay = PNG drawn over the screen (relative to retroarch/overlays/)
#   overlay_opacity = 1..100 (percent, default 100)
#   overlay_cut = px of the overlay left out around the picture (default 0)
#   crt     = yes: a TV/arcade system; only these offer the Scanlines filter
# Values follow the Retro Game Corps guides as set up for RetroArch before.

[default]
scale = integer
filter = nearest

# --- handhelds ---
[gb]
core = gambatte
scale = custom 80 12 480 432   # Retro Game Corps: Jeltron_GB-DMG overlay, picture at 80/12 480x432
overlay = rgc/Jeltron_GB-DMG.png
overlay_opacity = 30   # Retro Game Corps uses 60 %; here only the LCD grid over the picture, the frame stays solid
overlay_cut = 4   # the frame's light-green 4 px screen edge matched the old palette, not Special 1

[gbc]
core = gambatte
scale = custom 80 12 480 432
overlay = rgc/Jeltron_GB-Color.png

[gba]
core = mgba
scale = custom 0 0 640 427
filter = sharp
overlay = rgc/Perfect_GBA.png

[gamegear]
core = genesis_plus_gx
# exactly the window of the 351V frame (483x435 at 78,22); 3x 160x144
scale = custom 80 24 480 432
overlay = GG/Gamegear_neu.png

[ngp]
core = mednafen_ngp
[ngpc]
core = mednafen_ngp
[wonderswan]
core = mednafen_wswan
[wonderswancolor]
core = mednafen_wswan
[atarilynx]
core = handy
[virtualboy]
core = mednafen_vb

