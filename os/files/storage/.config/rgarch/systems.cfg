# rgarch per-system settings. Sections are folder names under /storage/roms.
#   core    = libretro core name (cores/<core>_libretro.so)
#   scale   = integer | aspect | full | custom X Y W H   (640x480 screen)
#   filter  = nearest | sharp | linear
#   overlay = PNG drawn over the screen (relative to retroarch/overlays/)
# Values follow the Retro Game Corps guides as set up for RetroArch before.

[default]
scale = integer
filter = nearest

# --- handhelds ---
[gb]
core = gambatte
overlay = mix/GB-DMG_jeltron-grid.png

[gbc]
core = gambatte
scale = custom 80 12 480 432
overlay = rgc/Jeltron_GB-Color.png

[gba]
core = mgba
scale = custom 0 0 640 427
filter = sharp
overlay = rgc/Perfect_GBA.png

[gamegear]
core = genesis_plus_gx
# exactly the window of the 351V frame (483x435 at 78,22); 3x 160x144
scale = custom 80 24 480 432
overlay = GG/Gamegear_neu.png

[ngp]
core = mednafen_ngp
[ngpc]
core = mednafen_ngp
[wonderswan]
