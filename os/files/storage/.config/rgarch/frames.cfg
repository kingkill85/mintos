# Frames to choose per system (Einstellungen / game menu: Optionen > Rahmen).
#   <label> = <PNG under retroarch/overlays/> <x> <y> <w> <h>   (picture placed in the PNG's window)
#   <label> = @<style>                                          (drawn, picture unchanged)
# x y w h: where the game picture goes. Handhelds: measured from each PNG's window (smallest
# black gap, at most a pixel or two hidden, raster lines on the game's pixel edges).
# systems.cfg's own overlay stays the "Standard" choice. Every system also gets the drawn
# frames "Schlicht schwarz" and "Schlicht grau" (rgarch draws them around any picture).

